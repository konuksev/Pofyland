name: Feature request
description: An idea that would make Pofyland better for you.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the situation?
      description: What were you doing, and what got in the way? A real moment beats an abstract wish.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Sketches welcome.
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Which agents do you use?
      multiple: true
      options:
        - Claude Code (terminal)
        - Claude desktop app
        - Codex
        - Antigravity
        - Other
  - type: input
    id: sessions
    attributes:
      label: How many sessions do you usually run at once?
      placeholder: "3-5"
